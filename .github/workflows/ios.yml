name: iPhone and iPad validation and TestFlight
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to TestFlight
        type: boolean
        default: false
      archive:
        description: Sign and validate an export without uploading to Apple
        type: boolean
        default: false
      devices:
        description: Reuse unchanged successful iPhone QA only when recorded in release evidence
        type: choice
        options: [both, iPad]
        default: both
permissions:
  contents: read
concurrency:
  group: sopa-ios-release
  cancel-in-progress: false
jobs:
  iphone:
    if: github.actor == github.repository_owner && !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.devices == 'iPad' && '["iPad"]' || '["iPhone","iPad"]') }}
    name: Native QA (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
      - run: npx cap sync ios && node scripts/prepare-ios.mjs
      - name: Select supported Xcode and prepare UI tests
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          ruby scripts/add-ios-ui-tests.rb
      - name: Verify native benefit and engagement policies
        run: |
          swiftc -D DEBUG plugins/sopa-ads/ios/Sources/SopaAdsPlugin/SopaBenefitLedger.swift plugins/sopa-ads/ios/Sources/SopaAdsPlugin/SopaEngagement.swift scripts/verify-benefits.swift -o /tmp/sopa-benefit-checks
          /tmp/sopa-benefit-checks
      - name: Run the bundled game on ${{ matrix.device }}
        env:
          SOPA_DEVICE_CLASS: ${{ matrix.device }}
        run: |
          set -o pipefail
          # StoreKitTest configuration sync regressed in later 26.x simulator
          # runtimes (Apple FB22237318). Keep SDK/Xcode current while testing
          # purchases on the installed 26.2 runtime; do not pick an arbitrary OS.
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if k.endswith("iOS-26-2") for x in v if os.environ["SOPA_DEVICE_CLASS"] in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "SOPA_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project ios/App/App.xcodeproj -scheme SopaQA -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath artifacts/iPhone-QA.xcresult CODE_SIGNING_ALLOWED=NO | tee iphone-qa.log
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d artifacts/iPhone-QA.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/iPhone-QA.xcresult --output-path artifacts/screenshots
          fi
          if [ -n "$SOPA_SIMULATOR" ]; then
            xcrun simctl spawn "$SOPA_SIMULATOR" log show --last 20m --style compact --predicate 'process == "App" OR process == "com.apple.WebKit.WebContent" OR process == "com.apple.WebKit.GPU"' > artifacts/native-runtime.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sopa3D-${{ matrix.device }}-QA-${{ github.sha }}
          path: |
            artifacts/iPhone-QA.xcresult
            artifacts/screenshots
            artifacts/native-runtime.log
            iphone-qa.log
          retention-days: 3
  testflight:
    needs: iphone
    if: github.ref == 'refs/heads/main' && (inputs.upload || inputs.archive)
    runs-on: macos-26
    environment: app-store-production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm run build && npx cap sync ios && node scripts/prepare-ios.mjs
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Sign, verify and optionally upload
        env:
          SOPA_TESTFLIGHT_UPLOAD: ${{ inputs.upload && 'true' || 'false' }}
          SOPA_NATIVE_EXPORT: ${{ inputs.archive && 'true' || 'false' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: node scripts/build-testflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sopa3D-TestFlight-${{ github.sha }}
          path: artifacts/testflight/
          retention-days: 3


